substitutions:
  friendlyname: "alarmclock"
  ha_api_key: !secret home_assistant_api_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  hotspot_password: !secret hotspot_password

esphome:
  name: ${friendlyname}
  friendly_name: ${friendlyname}
  on_boot:
    then:
      - delay: 5s
      - media_player.volume_set:
         id: slaapkamer_media_player
         volume: 10%

esp32:
  board:   esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: info

# Enable Home Assistant API
api:
  encryption:
    key: ${ha_api_key}
  actions:
    - action: rtttl_play
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
#      rtttl.play: 'Flintstones:d=4,o=5,b=200:g#,c#,8p,c#6,8a#,g#,c#,8p,g#,8f#,8f,8f,8f#,8g#,c#,d#,2f,2p,g#,c#,8p,c#6,8a#,g#,c#,8p,g#,8f#,8f,8f,8f#,8g#,c#,d#,2c#'


ota:
  - platform: esphome
    encryption:
      key: ${ha_api_key}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendlyname} Fallback Hotspot"
    password: ${hotspot_password}

captive_portal:

globals:
  - id: dim_direction_up
    type: bool
    restore_value: no
    initial_value: 'true'

# AUX1 pin is GPIO8
# AUX2 pin is GPIO2

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO9
    i2s_bclk_pin: GPIO10

speaker:
  - platform: i2s_audio
    id: slaapkamer_speaker
    dac_type: external
    i2s_dout_pin: GPIO11
    channel: mono

media_player:
  - platform: speaker
    name: ${friendlyname} Player
    id: slaapkamer_media_player
    announcement_pipeline:
      speaker: slaapkamer_speaker

i2c:
    sda: GPIO21
    scl: GPIO47

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Brussels
    servers:
     - 0.be.pool.ntp.org
     - 1.be.pool.ntp.org
     - 2.be.pool.ntp.org

display:
  - platform: tm1637
    clk_pin: GPIO18
    dio_pin: GPIO17
    inverted: true
    length: 4
    update_interval: 500ms
    intensity: 0
    id: temp_display
    lambda: |-
        it.printf("%.0f~C", id(bedroom_temperature).state);

  - platform: tm1637
    clk_pin: GPIO15
    dio_pin: GPIO16
    update_interval: 500ms
    length: 4
    intensity: 0
    id: time_display
    lambda: |-
        auto t = id(sntp_time).now();
        if (!t.is_valid()) {
          it.print("--.--");
          return;
        }
        int hour = t.hour;
        int minute = t.minute;

        // Blink colon every 2 seconds
        bool blink = (t.second % 2) == 0;

        if (hour < 10) {
          it.printf(" %d%s%02d", hour, blink ? "." : "", minute);
          } else {
          it.printf("%02d%s%02d", hour, blink ? "." : "", minute);
        }

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      inverted: true
      mode:
        input: true
    name: "${friendlyname} Knop Links"
    filters:
      - delayed_on: 10ms
  - platform: gpio
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
    name: "${friendlyname} Knop Midden"
    filters:
      - delayed_on: 10ms
  - platform: gpio
    pin:
      number: GPIO6
      inverted: true
      mode:
        input: true
    name: "${friendlyname} Knop Rechts"
    id: knop_rechts
    filters:
      - delayed_on: 10ms
    on_multi_click:
      # 1. DOUBLE CLICK (Must go FIRST)
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
        then:
          - logger.log: "Double click"
          - light.turn_on:
              id: bedroomleds
              brightness: 100%

      # 2. SHORT CLICK (Single click)
      - timing:
          - ON for at most 0.7s
          - OFF for at least 0.4s
        then:
          - logger.log: "Simple click"
          - light.toggle: bedroomleds

      # 3. LONG CLICK (Hold to dim)
      - timing:
          - ON for at least 1s
        then:
          - logger.log: "LONG click (Wave Dimming)"
          - lambda: |-
              // If the light is off, force direction UP and turn it on to minimum first
              if (!id(bedroomleds).current_values.is_on()) {
                id(dim_direction_up) = true;
                auto call = id(bedroomleds).turn_on();
                call.set_brightness(0.1f); // 10% minimum brightness
                call.perform();
              } else {
                // If the light is already on, toggle the wave direction normally
                id(dim_direction_up) = !id(dim_direction_up);
              }
          - delay: 0.2s
          - while:
              condition:
                binary_sensor.is_on: knop_rechts
              then:
                - light.dim_relative:
                    id: bedroomleds
                    relative_brightness: !lambda |-
                      if (id(dim_direction_up)) {
                        return 0.05;
                      } else {
                        return -0.05;
                      }
                    transition_length: 0.1s
                    brightness_limits:
                      min_brightness: 10%
                      max_brightness: 100%
                - delay: 0.2s

sensor:
  - platform: internal_temperature
    name: "${friendlyname} Internal Temperature"
    entity_category: "diagnostic"
    update_interval: 5.0min

  - platform: uptime
    name: ${friendlyname} Uptime
    id: sys_uptime
    entity_category: "diagnostic"
    filters:
      - lambda: return x / 86400;
    unit_of_measurement: "d"
    update_interval: 5.0min

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${friendlyname} WiFi Signal dB"
    id: wifi_signal_db
    entity_category: "diagnostic"
    update_interval: 5.0min

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendlyname} WiFi Signal Percent"
    filters:
      - lambda: return clamp(2 * (x + 100.0), 0.0, 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"

  - platform: adc
    id: light_sensor
    name: ${friendlyname} light Sensor
    update_interval: 3s
    pin: GPIO1
    attenuation: 12db
    on_value:
      then:
        - lambda: |-
            // at 1.5, I want full brightness, hence the clamp
            int intensity = clamp((int)(x * 4.0 + 1.0), 1, 7);
            // Apply to both TM1637 displays
            //ESP_LOGI("display", "intensity is: %d", intensity);
            id(temp_display).set_intensity(intensity);
            id(time_display).set_intensity(intensity);
  - platform: bme68x_bsec2
    temperature:
      name: "BME680 Temperature"
      id: bedroom_temperature
    pressure:
      name: "BME680 Pressure"
    humidity:
      name: "BME680 Humidity"
    iaq:
      name: "BME680 IAQ"
      id: iaq
    co2_equivalent:
      name: "BME680 CO2 Equivalent"
    breath_voc_equivalent:
      name: "BME680 Breath VOC Equivalent"

text_sensor:
  - platform: bme68x_bsec2
    iaq_accuracy:
      name: "BME680 IAQ Accuracy"

bme68x_bsec2_i2c:
  address: 0x77
  model: bme680
  operating_age: 28d
  sample_rate: ULP
  supply_voltage: 3.3V

output:
  - platform: ledc
    pin: GPIO7
    id: leds
    # allows for 12 bit resolution
    frequency: 19531
  - platform: ledc
    pin: GPIO13
    id: buzzer_out
    frequency: 1000
    max_power: 0.02

switch:
  - platform: gpio
    pin: GPIO12
    name: ${friendlyname} slaapkamerdac
    id: slaapkamerdac
    on_turn_on:
      - media_player.volume_set:
          id: slaapkamer_media_player
          volume: 10%

rtttl:
  output: buzzer_out
  id: my_rtttl

light:
  - platform: monochromatic
    name: "${friendlyname} Night Light"
    output: leds
    id: bedroomleds
